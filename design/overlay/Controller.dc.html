<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Controller map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>body{margin:0}a{color:#7cb8ff}a:hover{color:#a9d0ff}.m{font-family:'JetBrains Mono',monospace}</style>
</helmet>
<div style="width:1100px;height:620px;box-sizing:border-box;padding:28px;background:#0b0d10;font-family:Inter,sans-serif;color:#e6e8eb;font-size:13px;display:flex;flex-direction:column;gap:18px">
  <h2 style="margin:0;font-size:20px">Controller map</h2>
  <div style="display:flex;gap:20px">
    <div style="flex:1;background:#14171c;border:1px solid #2a2f38;border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px">
      <span style="color:#9aa3ad;font-size:11px">HOLD “…” (QUICK) + — works in game</span>
      <sc-for list="{{chords}}" as="c" hint-placeholder-count="8">
        <div style="display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid #20242b">
          <span class="m" style="width:130px;padding:4px 8px;border-radius:6px;background:{{c.bg}};color:{{c.fg}};text-align:center">{{c.k}}</span>
          <span>{{c.a}}</span>
        </div>
      </sc-for>
    </div>
    <div style="flex:1;background:#14171c;border:1px solid #2a2f38;border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px">
      <span style="color:#9aa3ad;font-size:11px">INSIDE THE OVERLAY (ImGui gamepad nav)</span>
      <sc-for list="{{nav}}" as="c" hint-placeholder-count="6">
        <div style="display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid #20242b">
          <span class="m" style="width:130px;padding:4px 8px;border-radius:6px;background:#23272e;text-align:center">{{c.k}}</span>
          <span>{{c.a}}</span>
        </div>
      </sc-for>
      <p style="margin:8px 0 0;color:#9aa3ad">Mouse works too: click rows, drag a region box. Game input is blocked while the overlay has focus.</p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1100,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    const chords = [
      ['[open chord]','open / close overlay',1],['Start','mark this moment'],['top face','pick draw under crosshair'],['left face','screenshot'],
      ['bottom face','dump frame'],['R3','toggle crosshair'],['d-pad down','“broken now”'],['d-pad up','“looks fixed”']
    ].map(([k,a,o]) => ({ k, a, bg: o ? '#1e3a5c' : '#23272e', fg: o ? '#cfe4ff' : '#e6e8eb' }));
    const nav = [
      ['d-pad / L stick','move focus'],['A','select / activate'],['B','back / close panel'],
      ['LB / RB','switch tab'],['R stick','scroll list'],['“…” + open chord','close overlay']
    ].map(([k,a]) => ({ k, a }));
    return { chords, nav };
  }
}
</script>
</body>
</html>
